function sceneItems(sc) {

function bodyBox(root) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3(); let meshes = 0, tris = 0;
  (function walk(o, skip) {

    if (o.isMesh) { meshes++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; if (!ex) box.union(new THREE.Box3().setFromObject(o, true)); }
    for (const ch of o.children) walk(ch, ex);

}
const JUNK = { variant: 42, color: 'zzz', color2: '#12', color3: {}, material: 'unobtanium', style: 9, doors: 'abc', drawers: -5, sink: {}, cooktop: [], counter: 5, counterColor: '#12', plinth: 'q', handles: 0, oven: 'x', dishwasher: null, corner: 0, glassDoors: 'q', open: null, microwave: 3, fridge: {}, overhang: 1e9, waterfall: 'maybe', dispenser: 'q', burners: -3, faucet: 12, cistern: 4, basins: NaN, basin: false, mirror: 'yes', glass: 'x', frame: {}, tray: 'x', head: 7, screen: [], shape: 3, cabinet: {}, floor: 'x', stand: [] };
function runTests() {
  const fails = [], lines = []; let builds = 0, maxMesh = ['', 0], maxTri = ['', 0];
  const ctx = document.createElement('canvas').getContext('2d');
  const check = (type, label, w, d, h, p, opts = {}) => {
    const def = getModel(type); let root;
    try { root = def.build({ w: w / 100, d: d / 100, h: h / 100, p, item: { id: 't', type } }); builds++; } catch (e) { fails.push(`${type} [${label}] build threw: ${e.message}`); return; }
    try { ctx.save(); def.draw2d(ctx, { w, d, h, p, px: 0.5, item: { id: 't', type } }); ctx.restore(); ctx.save(); def.draw2d(ctx, { w, d, h, p, px: 8, item: null }); ctx.restore(); } catch (e) { fails.push(`${type} [${label}] draw2d threw: ${e.message}`); }
    if (!root || !root.isObject3D) { fails.push(`${type} [${label}] build returned no Object3D`); return; }
    const { box, meshes, tris } = bodyBox(root);
    if (meshes > maxMesh[1]) maxMesh = [`${type} [${label}]`, meshes]; if (tris > maxTri[1]) maxTri = [`${type} [${label}]`, Math.round(tris)];
    if (opts.nobox) return;
    const e = 0.0101, W = w / 100, D = d / 100, H = h / 100, bad = [];
    if (Math.abs(box.min.x + W / 2) > e || Math.abs(box.max.x - W / 2) > e) bad.push(`x ${box.min.x.toFixed(3)}..${box.max.x.toFixed(3)} want ±${(W / 2).toFixed(3)}`);
    if (Math.abs(box.min.z + D / 2) > e || Math.abs(box.max.z - D / 2) > e) bad.push(`z ${box.min.z.toFixed(3)}..${box.max.z.toFixed(3)} want ±${(D / 2).toFixed(3)}`);
    if ((opts.float ? box.min.y < -e : Math.abs(box.min.y) > e) || Math.abs(box.max.y - H) > e) bad.push(`y ${box.min.y.toFixed(3)}..${box.max.y.toFixed(3)} want 0..${H.toFixed(3)}`);
    if (bad.length) fails.push(`${type} [${label}] bbox ${bad.join(' | ')}`);
  };
  const FLOAT = { toilet: ['wall-hung'], vanity: ['wall-hung'], sink: ['wall-hung'] };
  for (const [type, vars] of Object.entries(Object.assign({}, ...Object.values(GROUPS)))) {
    const T = MODEL_TYPES[type], s = T.size, first = (/'([^']+)'/.exec(T.params.variant || '') || [])[1];
    check(type, 'default {}', s.w, s.d, s.h, {}, { float: (FLOAT[type] || []).includes(first) });
    vars.forEach((v) => check(type, v.label, v.w, v.d, v.h, v.p, v));
    for (const key of ['variant', 'shape', 'frame', 'head', 'open', 'glass', 'basin', 'counter', 'handles', 'cooktop', 'sink', 'faucet']) {
      const en = T.params[key]; if (!en) continue;
      for (const m of String(en).matchAll(/'([^']+)'/g)) check(type, `${key}=${m[1]}`, s.w, s.d, s.h, { [key]: m[1] }, { float: (FLOAT[type] || []).includes(key === 'variant' ? m[1] : first), nobox: type === 'shower' && (m[1] === 'none' && key === 'head') });
    }
    for (const key of Object.keys(T.params)) if (/boolean/.test(T.params[key])) check(type, `${key}=true`, s.w, s.d, s.h, { [key]: true }, { float: (FLOAT[type] || []).includes(first) });

    for (const [w, d, h] of [[1, 1, 1], [1000, 3, 2], [3, 900, 400], [NaN, undefined, -5], [25, 25, 25], [300, 300, 300]]) check(type, `junk size ${w}×${d}×${h}`, w, d, h, {}, { nobox: true });
    for (const junkP of [null, 'str', 7, [1, 2]]) check(type, `p=${JSON.stringify(junkP)}`, s.w, s.d, s.h, junkP, { nobox: true });

}
