// ───────────── 3D set-up ─────────────
const TW = 300, TH = 270, COLS = 6;
let renderer, scene, camera, sun, ground;
function init3D() {

  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;

  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.45;

function frame(box, w, h, dir = [0.75, 0.55, 1]) {
  const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3()), r = Math.max(0.2, sz.length() / 2);
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const dist = r / Math.sin((camera.fov * Math.PI) / 360) * 1.02, v = new THREE.Vector3(...dir).normalize();

const triCount = (obj) => { let t = 0; obj.traverse((o) => { if (o.isMesh) t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; }); return Math.round(t); };

/** Bounding-box check → '' when fine, otherwise a description. Horizontal ±2 cm; vertical: y0 ≈ 0 and top ≈ h except documented cases. */
function bboxIssue(type, s, obj) {
  const { w, d, h } = sizeOf(type, s), b = new THREE.Box3().setFromObject(obj), e = 0.02, issues = [];
  if (Math.abs(b.min.x + w / 200) > e || Math.abs(b.max.x - w / 200) > e) issues.push(`x ${(b.min.x * 100).toFixed(1)}..${(b.max.x * 100).toFixed(1)} ≠ ±${w / 2}`);
  if (Math.abs(b.min.z + d / 200) > e || Math.abs(b.max.z - d / 200) > e) issues.push(`z ${(b.min.z * 100).toFixed(1)}..${(b.max.z * 100).toFixed(1)} ≠ ±${d / 2}`);
  const below = type === 'pool', above = type === 'raised-bed' || (type === 'pool' && b.min.y < -0.05);
  if (!below && Math.abs(b.min.y) > e) issues.push(`y0 ${(b.min.y * 100).toFixed(1)}`);
  if (!above && Math.abs(b.max.y - h / 100) > e) issues.push(`top ${(b.max.y * 100).toFixed(1)} ≠ ${h}`);
  if (type === 'raised-bed' && b.max.y < h / 100 - e) issues.push(`top ${(b.max.y * 100).toFixed(1)} < ${h}`);
  return issues.join('; ');
}

const report = { failures: [], tris: {}, throws: [] };
function section(title, w, h) {

  const c = document.createElement('canvas'); c.width = w; c.height = h; c.id = 'sec-' + title.replace(/[^a-z0-9]+/gi, '-').toLowerCase(); out.appendChild(c);

}
function sheet3D(type) {
  const list = SPEC[type], rows = Math.ceil(list.length / COLS), g = section(`${type} 3d`, COLS * TW, rows * TH);
  list.forEach((s, i) => {
    const item = itemOf(type, s, i), obj = buildModel(item), tris = triCount(obj), issue = getModel(type) ? bboxIssue(type, s, obj) : 'not registered';

}
function draw2DItem(g, item, cx, cy, scale) {

}
function sheet2D(type) {

    g.strokeStyle = '#d8d5cc'; g.strokeRect(x + 0.5, y + 0.5, cw, chh);
  });
}

function corner3D() {

// ───────────── robustness: p = {} and junk params never throw ─────────────
function robustness() {
  const junk = [{}, undefined, null, { species: 42, variant: {}, kind: [], shape: 'zzz', color: 'not-a-colour', color2: 7, color3: null, material: 'unobtainium', age: 3, fruit: 'maybe', flowerColor: {}, flowerColors: 'red', edging: 9, mulch: null, plant: 'triffid', plantHeight: 'tall', crop: 0, frame: [], trellis: 'x', tile: -5, pattern: 1, coping: 1, water: {}, steps: 'escalator', depth: 'deep', cover: 'yes', deck: -3, seats: 'many', trimmed: 'no', style: 5 },
    { tile: 1e9, depth: 1e9, deck: 1e9, plantHeight: 1e9, seats: 1e9, flowerColors: [1, null, '#fff'] }, { tile: NaN, depth: 0, deck: 0, plantHeight: -1, seats: 0, flowerColors: [] }];
  const sizes = [null, [1, 1, 1], [3000, 20, 5], [15, 900, 600]];
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  for (const type of TYPES) {
    const def = getModel(type); if (!def) { report.throws.push(`${type}: not registered`); continue; }
    for (const p of junk) for (const sz of sizes) {
      const d = MODEL_TYPES[type].size, w = sz ? sz[0] : d.w, dd = sz ? sz[1] : d.d, h = sz ? sz[2] : d.h, tag = `${type} p=${JSON.stringify(p)} ${w}×${dd}×${h}`;
      try { const o = def.build({ w: w / 100, d: dd / 100, h: h / 100, p, item: undefined }); if (!o || !o.isObject3D) report.throws.push(`build returned nothing: ${tag}`); else o.traverse((m) => { if (m.isMesh) { const a = m.geometry.attributes.position.array; for (let i = 0; i < a.length; i++) if (!Number.isFinite(a[i])) { report.throws.push(`NaN vertex: ${tag}`); break; } } }); } catch (e) { report.throws.push(`build threw: ${tag}: ${e.message}`); }
      try { g.save(); g.translate(32, 32); def.draw2d(g, { w, d: dd, h, p, px: 1, item: undefined }); g.restore(); } catch (e) { g.restore(); report.throws.push(`draw2d threw: ${tag}: ${e.message}`); }
    }
  }
}

try {
  if (mode !== '2d') init3D();
  if (mode === 'all' || mode === '3d') for (const t of TYPES) sheet3D(t);
  if (mode === 'all' || mode === 'corner') { corner3D(); corner2D(); }
  if (mode === 'all' || mode === '2d') for (const t of TYPES) sheet2D(t);
  if (mode === 'test') { for (const t of TYPES) SPEC[t].forEach((s, i) => { const o = buildModel(itemOf(t, s, i)), issue = getModel(t) ? bboxIssue(t, s, o) : 'not registered'; report.tris[`${t}/${s.label}`] = triCount(o); if (issue) report.failures.push(`${t}/${s.label}: ${issue}`); }); }
  if (mode === 'all' || mode === 'test') robustness();
} catch (e) { report.throws.push('PAGE ERROR: ' + (e.stack || e.message)); }
const heavy = Object.entries(report.tris).sort((a, b) => b[1] - a[1]).slice(0, 14);
document.getElementById('report').innerHTML =
  `<span class="${report.failures.length ? 'bad' : 'ok'}">bounding-box failures: ${report.failures.length}</span>\n${report.failures.join('\n')}\n` +
  `<span class="${report.throws.length ? 'bad' : 'ok'}">throws / robustness problems: ${report.throws.length}</span>\n${report.throws.slice(0, 40).join('\n')}\n` +
  `heaviest models (triangles):\n${heavy.map(([k, v]) => `  ${v}  ${k}`).join('\n')}`;
window.__report = report; window.__done = true;
</script>
