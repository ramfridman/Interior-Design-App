// ───────────────────────── 3D contact sheet ─────────────────────────
function render3D() {
  const CW = Number(q.get('cell') || 400), CH = Math.round(CW * 0.74);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(CW, CH);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#e4e2de');
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.32;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#f1efeb', roughness: 0.96 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const key = new THREE.DirectionalLight('#fff3e2', 1.9); key.position.set(-2.6, 5, 3.4); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.015;
  Object.assign(key.shadow.camera, { left: -3.2, right: 3.2, top: 3.2, bottom: -3.2, near: 0.5, far: 14 });
  scene.add(key, key.target);
  const back = new THREE.DirectionalLight('#dfe8ff', 0.45); back.position.set(3, 3, -4); scene.add(back);
  scene.add(new THREE.HemisphereLight('#ffffff', '#b8b2a8', 0.55));
  const cam = new THREE.PerspectiveCamera(26, CW / CH, 0.05, 80);
  const VIEWS = [[32, 19, false], [212, 24, false], [0, 89.9, true]];
  const host = document.getElementById('sheet3d');
  for (const type of types) {
    const sec = document.createElement('div'); sec.className = 'sec'; sec.id = `sec3d-${type}`;
    sec.innerHTML = `<h2>${type} — 3D (front ¾ · back ¾ · top)</h2>`; host.appendChild(sec);
    VARIANTS[type].forEach((v, k) => {
      if (only != null && only !== k) return;
      const card = document.createElement('div'); card.className = 'card'; card.id = `c3d-${type}-${k}`; card.innerHTML = metaHTML(type, v); sec.appendChild(card);
      const obj = buildModel(itemOf(type, v, k)); scene.add(obj);
      const box = new THREE.Box3().setFromObject(obj, true), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
      let tris = 0, meshes = 0;
      obj.traverse((o) => { if (o.isMesh) { meshes++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
      card.querySelector('.stat').textContent = `${meshes} meshes · ${Math.round(tris)} tris · bbox ${(s.x * 100).toFixed(1)}×${(s.z * 100).toFixed(1)}×${(s.y * 100).toFixed(1)}`;
      const rad = 0.5 * s.length();
      for (const [az, el, top] of VIEWS) {
        const a = az * Math.PI / 180, e = el * Math.PI / 180, dist = (rad / Math.sin(cam.fov * Math.PI / 360)) * (top ? 0.86 : 0.9);
        cam.up.set(0, top ? 0 : 1, top ? -1 : 0);
        cam.position.set(c.x + Math.sin(a) * Math.cos(e) * dist, c.y + Math.sin(e) * dist, c.z + Math.cos(a) * Math.cos(e) * dist);
        cam.lookAt(c);
        renderer.render(scene, cam);
        const cv = document.createElement('canvas'); cv.width = CW; cv.height = CH; cv.getContext('2d').drawImage(renderer.domElement, 0, 0); card.appendChild(cv);
      }
      scene.remove(obj);
    });
  }
  renderer.dispose();
}

// ───────────────────────── 2D symbols ─────────────────────────
function render2D() {
  const host = document.getElementById('sheet2d');
  const dpr = Number(q.get('dpr') || 1);
  for (const type of types) {
    const sec = document.createElement('div'); sec.id = `sec2d-${type}`;
    sec.innerHTML = `<h2>${type} — 2D plan symbols (large · 0.5 px/cm · 0.2 px/cm; back of the item is at the top)</h2>`; host.appendChild(sec);
    const grid = document.createElement('div'); grid.className = 'grid2d'; sec.appendChild(grid);
    VARIANTS[type].forEach((v, k) => {
      if (only != null && only !== k) return;
      const card = document.createElement('div'); card.className = 'card'; card.id = `c2d-${type}-${k}`; grid.appendChild(card);
      const big = Math.min(3.2, 300 / Math.max(v.w, v.d));
      const scales = [big, 0.5, 0.2];
      const pad = 14, W = scales.reduce((a, s) => a + v.w * s + pad * 2, 0), H = Math.max(v.d * big + pad * 2, 60);
      const cv = document.createElement('canvas'); cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr); cv.style.width = `${Math.ceil(W)}px`; cv.style.height = `${Math.ceil(H)}px`;
      const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      let x = 0;
      for (const s of scales) {
        ctx.save(); ctx.translate(x + pad + v.w * s / 2, H / 2); ctx.scale(s, s);
        drawSymbol(ctx, itemOf(type, v, k), 1 / (s * dpr));
        ctx.restore(); x += v.w * s + pad * 2;
      }
      card.appendChild(cv);
      card.insertAdjacentHTML('beforeend', metaHTML(type, v));
    });
  }
}

// ───────────────────────── assertions ─────────────────────────
/** Bounding box == w×d×h (±1 cm), no throw with {} / junk params, for every type × variants × size sweep. */
function runTests() {
  const fails = [], notes = []; let n = 0, maxErr = 0, maxFit = 0, maxTris = 0, maxMeshes = 0;
  const JUNK = [undefined, null, {}, 7, 'x', [], { color: 5, color2: '#zz', color3: {}, material: 'unobtainium', material2: 42, style: [] },
    { seats: 'many', chaise: 3, arms: {}, legs: null, cushions: 0, back: 'banana', corner: 'yes', variant: {}, shape: [], upholstered: 'x', storage: null, seatHeight: 'tall', headrest: 2, base: 9, top: {}, topColor: 12, shelf: 'no', nest: -4, extendable: {}, drawers: 5, hutch: 'y' },
    { seats: 99, seatHeight: 9999, nest: 50, color: '__proto__', material: 'constructor', variant: 'toString' }, { seats: 0, seatHeight: -5, nest: 0 }, { seats: NaN, seatHeight: Infinity, nest: 2.7 }];
  const cv = document.createElement('canvas'); cv.width = 300; cv.height = 300; const ctx = cv.getContext('2d');
  const check = (type, label, w, d, h, p, strict = true) => {
    n++;
    const def = getModel(type);
    let obj;
    try { obj = def.build({ w: w / 100, d: d / 100, h: h / 100, p, item: { id: 't', type } }); }
    catch (e) { fails.push(`${type} [${label}] build threw: ${e.message}`); return; }
    if (!obj || !obj.isObject3D) { fails.push(`${type} [${label}] build returned no object`); return; }
    obj.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(obj, true);
    const err = Math.max(Math.abs(b.min.x + w / 200), Math.abs(b.max.x - w / 200), Math.abs(b.min.y), Math.abs(b.max.y - h / 100), Math.abs(b.min.z + d / 200), Math.abs(b.max.z - d / 200));
    if (!(err <= 0.01)) fails.push(`${type} [${label}] bbox off by ${(err * 100).toFixed(2)} cm: x ${b.min.x.toFixed(3)}..${b.max.x.toFixed(3)} y ${b.min.y.toFixed(3)}..${b.max.y.toFixed(3)} z ${b.min.z.toFixed(3)}..${b.max.z.toFixed(3)} (want ${w}×${d}×${h})`);
    else maxErr = Math.max(maxErr, err);
    let tris = 0, meshes = 0, bad = false;
    obj.traverse((o) => { if (o.isMesh) { meshes++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; const a = o.geometry.attributes.position.array; for (let i = 0; i < a.length; i++) if (!Number.isFinite(a[i])) { bad = true; break; } } });
    if (bad) fails.push(`${type} [${label}] non-finite vertex positions`);
    if (strict) { maxTris = Math.max(maxTris, tris); maxMeshes = Math.max(maxMeshes, meshes); if (tris > 6000 || meshes > 110) notes.push(`${type} [${label}] heavy: ${meshes} meshes / ${Math.round(tris)} tris`); }
    const f = obj.userData.fit;
    if (f && strict) { const dev = Math.max(...f.map((s) => Math.abs(s - 1))); maxFit = Math.max(maxFit, dev); if (dev > 0.035) notes.push(`${type} [${label}] fit correction ${f.map((s) => s.toFixed(3)).join(' / ')}`); }
    for (const px of [0.3, 2, 12]) {
      try { ctx.save(); ctx.translate(150, 150); def.draw2d(ctx, { w, d, h, p, px, item: { id: 't', type } }); ctx.restore(); }
      catch (e) { ctx.restore(); fails.push(`${type} [${label}] draw2d threw (px ${px}): ${e.message}`); break; }
    }
  };
  for (const type of types) {
    const def = getModel(type);
    if (!def) { fails.push(`${type}: not registered`); continue; }
    const sz = MODEL_TYPES[type].size;
    VARIANTS[type].forEach((v) => check(type, v.label, v.w, v.d, v.h, v.p));
    JUNK.forEach((p, i) => check(type, `junk#${i}`, sz.w, sz.d, sz.h, p, false));
    // size sweep: every variant's params at shrunken / stretched / odd boxes
    const SWEEP = [[0.6, 0.7, 0.7], [1.5, 1.2, 1.15], [0.8, 1.4, 1], [2.2, 1, 0.8], [1, 1, 1.5], [0.35, 0.35, 0.4]];
    VARIANTS[type].forEach((v) => SWEEP.forEach(([a, b, c], i) => check(type, `${v.label} ×sweep${i}`, Math.round(v.w * a), Math.round(v.d * b), Math.round(v.h * c), v.p, i < 5)));
    [[1, 1, 1], [5, 5, 5], [1000, 20, 30], [30, 600, 300]].forEach(([w, d, h]) => check(type, `extreme ${w}×${d}×${h}`, w, d, h, {}, false));
  }
  // determinism: two builds of the same item give the same vertex count
  for (const type of types) { const v = VARIANTS[type][0], a = buildModel(itemOf(type, v, 0)), b = buildModel(itemOf(type, v, 0)); let ca = 0, cb = 0; a.traverse((o) => { if (o.isMesh) ca += o.geometry.attributes.position.count; }); b.traverse((o) => { if (o.isMesh) cb += o.geometry.attributes.position.count; }); if (ca !== cb) fails.push(`${type}: non-deterministic build`); }
  return { checks: n, fails, notes, maxErrCm: +(maxErr * 100).toFixed(3), maxFitCorrectionPct: +(maxFit * 100).toFixed(2), maxTris: Math.round(maxTris), maxMeshes };
}
window.runTests = runTests;

try {
  if (q.get('test')) {
    const r = runTests(); window.__test = r;
    const el = document.getElementById('test'); el.hidden = false;
    el.textContent = `${r.fails.length ? 'FAILED' : 'PASSED'} — ${r.checks} checks, ${r.fails.length} failures · max bbox error ${r.maxErrCm} cm · max fit correction ${r.maxFitCorrectionPct}% · max ${r.maxTris} tris / ${r.maxMeshes} meshes\n` + r.fails.join('\n') + (r.notes.length ? `\n— notes —\n${r.notes.join('\n')}` : '');
  } else {
    if (view !== '2d') render3D();
    if (view !== '3d') render2D();
  }
} catch (e) { window.__error = String(e && e.stack || e); document.body.insertAdjacentHTML('afterbegin', `<pre style="color:#b00">${window.__error}</pre>`); }
window.__done = true;
</script>
</body>
