  ],

const q = new URLSearchParams(location.search);
const only = (q.get('type') || '').split(',').filter(Boolean), mode = q.get('mode') || 'all', TILE = Number(q.get('size')) || 230;
const status = document.getElementById('status'), root = document.getElementById('root');
const item = (type, v, i) => ({ id: `${type}-${i}`, type, w: v.w, d: v.d, h: v.h, params: v.params });

// ───────── 3D ─────────
const RS = 330;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(RS, RS); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9e6e0');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
scene.add(new THREE.HemisphereLight('#ffffff', '#c9c2b6', 0.9));
const sun = new THREE.DirectionalLight('#fff4e2', 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01; sun.shadow.radius = 5;
scene.add(sun, sun.target);
const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 100);
const standMat = new THREE.MeshStandardMaterial({ color: '#f1eee8', roughness: 0.95 });
const floorMat = new THREE.MeshStandardMaterial({ color: '#b89b78', roughness: 0.8 });

function render3d(type, v, i, canvas) {
  const T = MODEL_TYPES[type], pl = T.placement, w = v.w / 100, d = v.d / 100, h = v.h / 100;
  const def = getModel(type);
  let obj;
  try { obj = def.build({ w, d, h, p: v.params, item: item(type, v, i) }); } catch (e) { console.error(type, v.label, e); return String(e.message || e); }
  obj.traverse((o) => { if (o.isMesh) { if (o.userData.noShadow !== true) o.castShadow = true; o.receiveShadow = true; } });
  const stage = new THREE.Group(), R = Math.hypot(w, d, h) / 2, pad = Math.max(0.25, R * 0.5);
  let elev = 0;
  if (pl === 'ceiling') {
    const slab = new THREE.Mesh(new THREE.BoxGeometry(w + pad * 2, 0.03, d + pad * 2), standMat); slab.position.y = h + 0.015; slab.receiveShadow = true; stage.add(slab);
    const back = new THREE.Mesh(new THREE.BoxGeometry(w + pad * 2, h + pad, 0.03), standMat); back.position.set(0, (h + pad) / 2 - pad + 0.03, -d / 2 - pad); back.receiveShadow = true; stage.add(back);
  } else {
    if (pl === 'wall') { elev = Math.min(0.3, h * 0.25); const wall = new THREE.Mesh(new THREE.BoxGeometry(w + pad * 2, h + elev + pad, 0.03), standMat); wall.position.set(0, (h + elev + pad) / 2, -d / 2 - 0.015); wall.receiveShadow = true; stage.add(wall); }
    const fl = new THREE.Mesh(new THREE.BoxGeometry(w + pad * 2 + 1, 0.02, d + pad * 2 + 1), type === 'rug' || type === 'cushion' ? floorMat : standMat); fl.position.y = -0.01; fl.receiveShadow = true; stage.add(fl);
  }
  obj.position.y = elev; stage.add(obj); scene.add(stage);
  const flat = h < Math.max(w, d) * 0.12, dir = pl === 'ceiling' ? new THREE.Vector3(0.55, -0.16, 1) : flat ? new THREE.Vector3(0.35, 0.95, 0.75) : new THREE.Vector3(0.6, 0.42, 1);
  const c = new THREE.Vector3(0, elev + h / 2, 0), dist = (R * 1.12) / Math.sin(THREE.MathUtils.degToRad(14));
  camera.position.copy(c).addScaledVector(dir.normalize(), dist); camera.near = dist * 0.05; camera.far = dist * 4; camera.lookAt(c); camera.updateProjectionMatrix();
  sun.position.copy(c).add(new THREE.Vector3(-0.7, pl === 'ceiling' ? 0.35 : 1.25, 0.9).multiplyScalar(R * 3 + 1)); sun.target.position.copy(c);
  const sc = sun.shadow.camera; sc.left = sc.bottom = -R * 1.6; sc.right = sc.top = R * 1.6; sc.near = 0.05; sc.far = R * 8 + 4; sc.updateProjectionMatrix();
  renderer.render(scene, camera);
  canvas.getContext('2d').drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);
  scene.remove(stage);
  let tris = 0, meshes = 0;
  obj.traverse((o) => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; if (!o.geometry.userData.shared) o.geometry.dispose(); } });
  return { tris: Math.round(tris), meshes };
}

// ───────── 2D ─────────
function render2d(type, v, i, canvas) {
  const ctx = canvas.getContext('2d'), T = MODEL_TYPES[type], W = canvas.width, H = canvas.height, big = H, def = getModel(type);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  const draw = (cx, cy, s) => {
    ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
    if (T.placement === 'wall') { ctx.fillStyle = '#c9c5bd'; ctx.fillRect(-v.w / 2 - 12 / s, -v.d / 2 - 5 / s, v.w + 24 / s, 5 / s); }
    try { def.draw2d(ctx, { w: v.w, d: v.d, h: v.h, p: v.params, px: 1 / s, item: item(type, v, i) }); } catch (e) { console.error('2d', type, v.label, e); ctx.restore(); return String(e.message || e); }
    ctx.restore(); return null;
  };
  const m = Math.max(v.w, v.d), e1 = draw(big / 2, H / 2, Math.min((big - 24) / m, 7)), e2 = draw(big + (W - big) / 2, H / 2, Math.min(0.38, (W - big - 8) / m));
  return e1 || e2;
}

function cell(parent, cw, ch, label) {
  const c = document.createElement('div'); c.className = 'cell';
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch; cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const lb = document.createElement('div'); lb.className = 'lb'; lb.textContent = label; lb.style.maxWidth = cw + 'px';
  c.append(cv, lb); parent.append(c);
  return { c, cv, lb };
}

async function main() {
  const types = Object.keys(SHEET).filter((t) => !only.length || only.includes(t));
  for (const type of types) {
    for (const m of ['3d', '2d']) {
      if (mode !== 'all' && mode !== m) continue;
      const h2 = document.createElement('h2'); h2.textContent = `${type} — ${m.toUpperCase()}`; root.append(h2);
      const grid = document.createElement('div'); grid.className = 'grid'; root.append(grid);
      SHEET[type].forEach((v, i) => {
        const size = `${v.w}×${v.d}×${v.h}`;
        if (m === '3d') {
          const { c, cv, lb } = cell(grid, TILE, TILE, '');
          const r = render3d(type, v, i, cv);
          if (typeof r === 'string') { c.classList.add('err'); lb.textContent = `${v.label}: ${r}`; } else lb.textContent = `${v.label} · ${size} · ${r.tris}▲ ${r.meshes}m`;
        } else {
          const { c, cv, lb } = cell(grid, 250, 150, `${v.label} · ${size}`);
          const e = render2d(type, v, i, cv);
          if (e) { c.classList.add('err'); lb.textContent = `${v.label}: ${e}`; }
        }
      });
      status.textContent = `${type} ${m}`;
      await new Promise((r) => setTimeout(r));
    }
  }
  status.textContent = 'done'; document.body.dataset.ready = '1';
}

/** Headless assertions: bbox == w×d×h within 1 cm (lights excluded), nothing throws on {} / junk params / odd sizes. */
window.__runTests = () => {
  const junk = { variant: 42, species: null, shape: {}, pattern: [], pot: 3, color: 'zzz', color2: {}, color3: 12, material: 5, material2: 'unobtainium', style: 9, count: 'abc', open: 'x', on: 'no', shade: 7, lightColor: [], palette: 'x', blades: -4, drop: 'q', flowers: 'q', frame: 1, rod: {}, fringe: 'yes', light: 'maybe', potColor: 0, artificial: 'q' };
  const sizes = [[5, 5, 5], [300, 20, 10], [20, 300, 400], [37, 91, 143]], fails = [], stats = {}, scratch = document.createElement('canvas').getContext('2d');
  const lampTypes = ['floor-lamp', 'table-lamp', 'pendant', 'ceiling-light', 'wall-light'];
  let n = 0;
  for (const type of Object.keys(SHEET)) {
    const def = getModel(type), T = MODEL_TYPES[type], st = stats[type] = { cases: 0, maxTris: 0, maxMeshes: 0, maxErrCm: 0 };
    if (!def) { fails.push(`${type}: not registered`); continue; }
    const cases = SHEET[type].map((v) => ({ ...v }));
    cases.push({ label: '{}', ...T.size, params: {} }, { label: 'junk', ...T.size, params: junk }, { label: 'null params', ...T.size, params: null }, { label: 'on:false', ...T.size, params: { on: false } });
    for (const [w, d, h] of sizes) for (const v of [SHEET[type][0], SHEET[type][SHEET[type].length - 1], { label: 'junk', params: junk }]) cases.push({ label: `${v.label} @${w}x${d}x${h}`, w, d, h, params: v.params });
    for (const variantKey of ['variant', 'species', 'shape', 'pattern']) {
      const spec = T.params[variantKey]; if (!spec) continue;
      for (const m of spec.matchAll(/'([a-z-]+)'/g)) cases.push({ label: `${variantKey}=${m[1]}`, ...T.size, params: { [variantKey]: m[1] } }, { label: `${variantKey}=${m[1]} @60x25x45`, w: 60, d: 25, h: 45, params: { [variantKey]: m[1] } });
    }
    for (const v of cases) {
      n++; st.cases++;
      const tag = `${type} [${v.label}] ${v.w}×${v.d}×${v.h}`;
      try {
        const obj = def.build({ w: v.w / 100, d: v.d / 100, h: v.h / 100, p: v.params, item: { id: tag } });
        obj.updateMatrixWorld(true);
        const b = new THREE.Box3().setFromObject(obj, true), s = b.getSize(new THREE.Vector3());
        const err = Math.max(Math.abs(s.x - v.w / 100), Math.abs(s.z - v.d / 100), Math.abs(s.y - v.h / 100), Math.abs(b.min.y), Math.abs(b.min.x + v.w / 200), Math.abs(b.min.z + v.d / 200)) * 100;
        st.maxErrCm = Math.max(st.maxErrCm, err);
        if (!(err <= 1)) fails.push(`${tag}: bbox off by ${err.toFixed(2)} cm (size ${(s.x * 100).toFixed(1)}×${(s.z * 100).toFixed(1)}×${(s.y * 100).toFixed(1)})`);
        let tris = 0, meshes = 0, lights = 0, bad = 0;
        obj.traverse((o) => {
          if (o.isLight) lights++;
          if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; const p = g.attributes.position.array; for (let k = 0; k < p.length; k++) if (!Number.isFinite(p[k])) { bad++; break; } g.dispose(); }
        });
        st.maxTris = Math.max(st.maxTris, Math.round(tris)); st.maxMeshes = Math.max(st.maxMeshes, meshes);
        if (bad) fails.push(`${tag}: NaN vertices`);
        if (lights > 1) fails.push(`${tag}: ${lights} lights`);
        const off = v.params && v.params.on === false;
        if (lampTypes.includes(type) && lights !== (off ? 0 : 1)) fails.push(`${tag}: expected ${off ? 0 : 1} light, got ${lights}`);
      } catch (e) { fails.push(`${tag}: build threw ${e.message}`); }
      try { scratch.save(); def.draw2d(scratch, { w: v.w, d: v.d, h: v.h, p: v.params, px: 0.5, item: { id: tag } }); scratch.restore(); } catch (e) { fails.push(`${tag}: draw2d threw ${e.message}`); }
    }
    try { def.build({}); def.build(); def.draw2d(scratch, {}); def.draw2d(scratch); buildModel({ type, w: 0, d: -3, h: NaN }); } catch (e) { fails.push(`${type}: threw on empty args: ${e.message}`); }
  }
  return { cases: n, fails, stats };
};

main().catch((e) => { status.textContent = 'ERROR ' + e.message; console.error(e); document.body.dataset.ready = '1'; });
</script>
