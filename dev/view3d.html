<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E7 — 3D view test page</title>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e6df; font: 13px/1.3 system-ui, sans-serif; }
  #view { position: fixed; inset: 0; --accent: #2f7cf6; }
  #bar { position: fixed; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 20px); z-index: 5; }
  #bar button, #bar label { border: 0; border-radius: 8px; padding: 6px 10px; background: rgba(20, 22, 26, .72); color: #fff; font: inherit; cursor: pointer; backdrop-filter: blur(6px); }
  #bar button:hover { background: rgba(20, 22, 26, .9); }
  #bar input[type=range] { vertical-align: middle; width: 110px; }
  #info { position: fixed; right: 10px; bottom: 10px; padding: 6px 10px; border-radius: 8px; background: rgba(20, 22, 26, .72); color: #fff; font: 12px/1.4 ui-monospace, monospace; white-space: pre; z-index: 5; pointer-events: none; }
  body.bare #bar, body.bare #info { display: none; }
</style>
</head>
<body>
<div id="view"></div>
<div id="bar"></div>
<div id="info"></div>
<script type="module">
import { store } from '../src/core/store.js';
import { PLAN } from '../src/core/plan.js';
import { initialLayout } from '../src/core/initial-layout.js';
import * as catalog from '../src/catalog/index.js';
import * as models from '../src/models/index.js';
import { createView3D } from '../src/view3d/index.js';
import { getThumbnail } from '../src/view3d/thumbs.js';

const q = new URLSearchParams(location.search);
if (q.has('bare')) document.body.classList.add('bare');
store.persist = false;
await Promise.all([models.loadModels(), catalog.loadCatalog()]);
// store.load() keeps items as given, so give the architect layout stable ids here.
store.load({ items: initialLayout().map((it, i) => ({ ...it, id: it.id || `arch-${i + 1}` })) });
const ctx = { store, plan: PLAN, catalog, models };
const view = createView3D(document.getElementById('view'), ctx);

const bar = document.getElementById('bar');
const button = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; bar.appendChild(b); return b; };
for (const p of ['aerial', 'top', 'front', 'garden', 'interior', ...PLAN.rooms.map((r) => r.id), ...PLAN.outdoorAreas.map((r) => r.id)]) button(p, () => view.setCameraPreset(p));
button('▶ walk', () => view.setMode(view.getMode() === 'walk' ? 'orbit' : 'walk'));
button('roof', () => store.setUI({ showRoof: !store.ui.showRoof }));
button('cutaway', () => store.setUI({ wallsCutaway: !store.ui.wallsCutaway }));
button('place sofa', () => view.startPlacing({ type: 'sofa', name: 'Test sofa', w: 220, d: 95, h: 82, params: { seats: 3, color: '#7d8c7a' }, placement: 'floor' }));
button('place art', () => view.startPlacing({ type: 'wall-art', name: 'Test art', w: 90, d: 3, h: 60, elev: 130, params: {}, placement: 'wall' }));
button('snapshot', async () => { const url = await view.snapshot({ width: 2400, height: 1350 }); const a = document.createElement('a'); a.href = url; a.download = 'e7.png'; a.click(); });
button('undo', () => store.undo());
const label = document.createElement('label');
const time = Object.assign(document.createElement('input'), { type: 'range', min: 0, max: 24, step: 0.25, value: store.ui.timeOfDay });
time.oninput = () => store.setUI({ timeOfDay: Number(time.value) });
label.append('time ', time); bar.appendChild(label);
const dateLabel = document.createElement('label');
const date = Object.assign(document.createElement('input'), { type: 'date', value: store.ui.date });
date.onchange = () => store.setUI({ date: date.value });
dateLabel.append('date ', date); bar.appendChild(dateLabel);
for (const d of ['06-21', '12-21', '03-20']) button(d, () => { date.value = `${store.ui.date.slice(0, 4)}-${d}`; store.setUI({ date: date.value }); });
button('sun study', () => store.setUI({ sunStudy: !store.ui.sunStudy }));
button('daylight', () => store.setUI({ daylight: store.ui.daylight === false }));
button('overcast', () => store.setUI({ daylightSky: store.ui.daylightSky === 'overcast' ? 'clear' : 'overcast' }));

// ── live plan edits (what the plan editor will do): mutate PLAN in place, then store.emit('plan') ──
const rectsTouch = (a, b) => a.x <= b.x + b.w && b.x <= a.x + a.w && a.y <= b.y + b.h && b.y <= a.y + a.h;
const bounds = (poly) => { const xs = poly.map((p) => p[0]), ys = poly.map((p) => p[1]); return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) }; };
/** Interior wall pieces lying between two rooms (found from the data: the strip between their floor polygons). */
function partitionBetween(idA, idB) {
  const a = bounds(PLAN.rooms.find((r) => r.id === idA).polygon), b = bounds(PLAN.rooms.find((r) => r.id === idB).polygon);
  const strip = { x: Math.max(a.x, b.x), y: Math.min(a.y + a.h, b.y + b.h), w: Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), h: Math.abs(Math.max(a.y, b.y) - Math.min(a.y + a.h, b.y + b.h)) };
  return PLAN.walls.filter((w) => w.kind === 'interior' && w.x >= strip.x && w.x + w.w <= strip.x + strip.w && w.y >= strip.y && w.y + w.h <= strip.y + strip.h);
}
const planEdit = {
  original: JSON.stringify({ walls: PLAN.walls, openings: PLAN.openings, rooms: PLAN.rooms, wallOutline: PLAN.wallOutline }),
  partitionBetween,
  /** Join the two children's bedrooms: drop the partition, merge the floor polygons, fix the outline. */
  removePartition(idA = 'bedroom-2', idB = 'bedroom-1') {
    const gone = partitionBetween(idA, idB);
    if (!gone.length) return null;
    const A = PLAN.rooms.find((r) => r.id === idA), B = PLAN.rooms.find((r) => r.id === idB), a = bounds(A.polygon), b = bounds(B.polygon);
    const merged = { ...A, name: 'Bedrooms 1 + 2', polygon: [[a.x, a.y], [a.x + a.w, a.y], [a.x + a.w, b.y + b.h], [a.x, b.y + b.h]], label: [a.x + a.w / 2, (a.y + b.y + b.h) / 2] };
    PLAN.walls = PLAN.walls.filter((w) => !gone.includes(w));
    PLAN.rooms = PLAN.rooms.filter((r) => r !== B).map((r) => (r === A ? merged : r));
    PLAN.openings = PLAN.openings.map((o) => ({ ...o, rooms: (o.rooms || []).map((id) => (id === idB ? idA : id)) }));
    PLAN.wallOutline = PLAN.wallOutline.filter(([x1, y1, x2, y2]) => !gone.some((w) => rectsTouch(w, { x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1) }) && x1 > w.x - 1 && x2 < w.x + w.w + 1 && y1 >= w.y && y2 <= w.y + w.h));
    store.emit('plan', {});
    return gone;
  },
  /** Add a free-standing partition (plan cm). */
  addWall(x, y, w, h) {
    PLAN.walls = [...PLAN.walls, { id: 'w-dev-' + PLAN.walls.length, x, y, w, h, kind: 'interior' }];
    PLAN.wallOutline = [...PLAN.wallOutline, [x, y, x + w, y], [x, y + h, x + w, y + h], [x, y, x, y + h], [x + w, y, x + w, y + h]];
    store.emit('plan', {});
  },
  /** Slide a window along its wall by `by` cm (the wall pieces on both sides are resized). */
  moveWindow(id, by) {
    const o = PLAN.openings.find((q) => q.id === id), ax = o.axis === 'h' ? 'x' : 'y', len = o.axis === 'h' ? 'w' : 'h';
    const before = PLAN.walls.find((w) => w[ax] + w[len] === o[ax] && rectsTouch(w, o)), after = PLAN.walls.find((w) => w[ax] === o[ax] + o[len] && rectsTouch(w, o));
    if (!before || !after) return false;
    PLAN.walls = PLAN.walls.map((w) => (w === before ? { ...w, [len]: w[len] + by } : w === after ? { ...w, [ax]: w[ax] + by, [len]: w[len] - by } : w));
    PLAN.openings = PLAN.openings.map((q) => (q === o ? { ...o, [ax]: o[ax] + by } : q));
    store.emit('plan', {});
    return true;
  },
  reset() { Object.assign(PLAN, JSON.parse(planEdit.original)); store.emit('plan', {}); },
};
button('− bedroom partition', () => planEdit.removePartition());
button('+ wall', () => { const l = PLAN.rooms.find((r) => r.id === 'main').zones.find((z) => z.id === 'dining').label; planEdit.addWall(l[0] - 100, l[1], 200, 10); });
button('window →', () => planEdit.moveWindow('win-living-n', 40));
button('plan reset', () => planEdit.reset());

const info = document.getElementById('info');
/** Daylight solver status line (patches, timings, exposure) — view.debug.daylight(). */
function daylightInfo() {
  const d = view.debug && view.debug.daylight && view.debug.daylight();
  if (!d) return '\ndaylight: off';
  const s = d.state(), t = s.timings;
  return `\ndaylight ${s.enabled ? (s.ready ? (s.coarse ? 'coarse' : 'fine') : 'solving…') : 'off'} (${s.mode})  ${s.patches} patches  ${s.links} links  atlas ${s.atlas && s.atlas.join('×')}`
    + `\n  visibility ${t.visWorkerMs ?? '…'} ms  relight ${t.relight ?? '…'} ms  exposure ${s.exposure.toFixed(2)}  weight ${s.on.toFixed(2)}${s.failed ? '  FAILED: ' + s.error : ''}`;
}
let walkPos = null;
view.on('walk-position', (p) => { walkPos = p; });
view.on('mode', () => { walkPos = null; });
let sun = null;
const hhmm = (h) => (h == null ? '—' : `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor((h % 1) * 60)).padStart(2, '0')}`);
view.on('sun', (s) => { sun = s; });
setInterval(() => {
  if (!view.debug) return;
  const s = view.debug.stats();
  info.textContent = `${view.getMode()}  ${s.fps.toFixed(0)} fps  render ${s.renderMs.toFixed(1)} ms  ${s.calls} calls  ${(s.triangles / 1000).toFixed(0)}k tris  ${s.items} items`
    + (sun ? `\nsun ${sun.date} ${hhmm(sun.hours)}  az ${sun.azimuth.toFixed(1)}° ${sun.compass}  el ${sun.elevation.toFixed(1)}°  rise ${hhmm(sun.sunrise)}  set ${hhmm(sun.sunset)}` : '')
    + (s.planRebuilds ? `\nplan rebuild ${s.planRebuildMs.toFixed(1)} ms (×${s.planRebuilds})` : '')
    + (walkPos ? `\nwalk ${walkPos.x.toFixed(0)}, ${walkPos.y.toFixed(0)}  ${walkPos.heading.toFixed(0)}°  ${walkPos.spaceId}` : '')
    + `\nstand-ins: ${Object.entries(view.debug.standIns).filter(([, v]) => v).map(([k]) => k).join(', ') || 'none'}`
    + daylightInfo();
}, 400);

Object.assign(window, { view, store, PLAN, catalog, models, getThumbnail, ctx, planEdit });
view.on('ready', () => document.documentElement.classList.add('view-ready'));
</script>
</body>
</html>
